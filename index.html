<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLearn - Resizable</title>

    <!-- 1. Tailwind CSS (via CDN) -->

    <!-- 2. React & ReactDOM (via CDN) -->

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- 3. Babel Standalone (to compile JSX in browser) -->

    <!-- Custom Styles for Scrollbar & Resizer -->

        /* Custom Scrollbar for dark theme editor */
        textarea::-webkit-scrollbar { width: 10px; }
        textarea::-webkit-scrollbar-track { background: #0f172a; }
        textarea::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Resizer Hover Effect */
        .resizer-handle:hover {
            background-color: #3b82f6; /* Blue-500 */
            transition: background-color 0.2s;
        }
    </style>
</head>
<body class="bg-white">

    <!-- App Root -->
    <div id="root"></div>

    <!-- MAIN REACT SCRIPT -->

        const { useState, useEffect, useCallback, useRef } = React;

             <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>

                    {
                        id: "intro",
                        title: "1. Python Intro",
                        explanation: `Python is a popular programming language. It is known for its simple syntax and readability.\n\nIt is used for:\n• Web development\n• Data Science\n• Machine Learning\n\nExample:\nThe print() function is used to output text to the screen.`,
                        code: `# Python Intro\nprint("Hello, World!")`
                    },
                    {
                        id: "syntax",
                        title: "2. Syntax & Indentation",
                        explanation: `Python uses indentation (whitespace) to define blocks of code, unlike other languages that use curly brackets {}.\n\nIf you skip indentation, Python will give you an error.\n\nThe number of spaces is up to you as a programmer, but it must be at least one (four is standard).`,

                    },

                        id: "variables",

                    },
                    {
                        id: "datatypes",
                        title: "4. Data Types",
                        explanation: `Python has the following data types built-in by default:\n\n• Text Type: str\n• Numeric Types: int, float\n• Sequence Types: list, tuple\n\nYou can get the data type of any object by using the type() function.`,
                        code: `x = 5\ny = "Hello"\nz = 20.5\n\nprint(type(x))\nprint(type(y))\nprint(type(z))`

                    {
                        id: "conditions",
                        title: "5. If...Else Conditions",
                        explanation: `Python supports the usual logical conditions from mathematics:\n• Equals: a == b\n• Not Equals: a != b\n• Less than: a < b\n\nThese conditions can be used in "if" statements to handle decision making.`,
                        code: `a = 200\nb = 33\nif b > a:\n  print("b is greater than a")\nelif a == b:\n  print("a and b are equal")\nelse:\n  print("a is greater than b")`

                        code: `fruits = ["apple", "banana", "cherry"]\nfor x in fruits:\n  print(x)\n\nprint("---")\n\nfor x in range(3):\n  print(x)`
                    },

                    },
                    {
                        id: "variables",

                        explanation: `There are 3 ways to declare a JavaScript variable:\n\n• var (old school)\n• let (modern, block scoped)\n• const (cannot be reassigned)\n\nAlways use const if the value should not be changed. Always use let if you can't use const.`,
                        code: `let name = "John";\nconst pi = 3.14;\n\nconsole.log(name);\nconsole.log(pi);\n\nname = "Jane"; // This is allowed\nconsole.log(name);`
                    },
                    {

                        title: "3. Data Types",

                        explanation: `An array is a special variable, which can hold more than one value.\n\nIt is a common practice to declare arrays with the const keyword.\n\nYou access an array element by referring to the index number.`,
                        code: `const cars = ["Saab", "Volvo", "BMW"];\nconsole.log(cars[0]);\n\ncars[0] = "Toyota";\nconsole.log(cars);\n\nconsole.log("I have " + cars.length + " cars.");`
                    },

                        code: `public class Main {\n  public static void main(String[] args) {\n    String name = "John";\n    int myNum = 15;\n    System.out.println(name);\n    System.out.println(myNum);\n  }\n}`

                        code: `public class Main {\n  public static void main(String[] args) {\n    int sum1 = 100 + 50;\n    int sum2 = sum1 + 250;\n    System.out.println(sum2);\n    System.out.println(10 % 3); // Remainder of 10/3\n  }\n}`

                        code: `public class Main {\n  public static void main(String[] args) {\n    int time = 20;\n    if (time < 18) {\n      System.out.println("Good day.");\n    } else {\n      System.out.println("Good evening.");\n    }\n  }\n}`

                        code: `public class Main {\n  public static void main(String[] args) {\n    for (int i = 0; i < 5; i++) {\n      System.out.println(i);\n    }\n  }\n}`
                    },

                        id: "arrays",

                        explanation: `Arrays are used to store multiple values in a single variable.\n\nTo declare an array, define the variable type with square brackets.\n\nAccess elements using index numbers (starts at 0).`,
                        code: `public class Main {\n  public static void main(String[] args) {\n    String[] cars = {"Volvo", "BMW", "Ford"};\n    System.out.println(cars[0]);\n    System.out.println(cars.length);\n  }\n}`

                        code: `public class Main {\n  static void myMethod() {\n    System.out.println("I just got executed!");\n  }\n\n  public static void main(String[] args) {\n    myMethod();\n    myMethod();\n  }\n}`

            cpp: {
                title: "C++",
                color: "bg-blue-600",
                topics: [
                    {

                        code: `#include <iostream>\nusing namespace std;\n\nint main() {\n  cout << "Hello World!";\n  return 0;\n}`

                        code: `#include <iostream>\nusing namespace std;\n\nint main() {\n  cout << "I am learning C++";\n  return 0;\n}`

                    {

                        code: `#include <iostream>\nusing namespace std;\n\nvoid myFunction() {\n  cout << "I just got executed!";\n}\n\nint main() {\n  myFunction();\n  return 0;\n}`

        // --- COMPONENT: App ---
        function App() {
            const [selectedLang, setSelectedLang] = useState('python');
            const [activeTopicIndex, setActiveTopicIndex] = useState(0);
            const [code, setCode] = useState('');
            const [consoleOutput, setConsoleOutput] = useState([]);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            
            // --- RESIZING STATE ---
            const [editorWidth, setEditorWidth] = useState(45); // Default percentage
            const [isResizing, setIsResizing] = useState(false);

            useEffect(() => {
                const topic = COURSES[selectedLang].topics[activeTopicIndex];
                setCode(topic.code);
                setConsoleOutput([]); 
            }, [selectedLang, activeTopicIndex]);

            // --- RESIZING LOGIC ---
            const startResizing = useCallback(() => {
                setIsResizing(true);
            }, []);

            const stopResizing = useCallback(() => {
                setIsResizing(false);
            }, []);

            const resize = useCallback((e) => {
                if (isResizing) {
                    // Calculate percentage from right edge
                    const newWidth = ((window.innerWidth - e.clientX) / window.innerWidth) * 100;
                    // Limit the resizing to avoid breaking UI (min 20%, max 80%)
                    if (newWidth > 20 && newWidth < 80) {
                        setEditorWidth(newWidth);
                    }
                }
            }, [isResizing]);

            useEffect(() => {
                if (isResizing) {
                    window.addEventListener("mousemove", resize);
                    window.addEventListener("mouseup", stopResizing);
                    // Add global cursor style
                    document.body.style.cursor = "col-resize";
                    document.body.style.userSelect = "none"; // Prevent text selection while dragging
                } else {
                    window.removeEventListener("mousemove", resize);
                    window.removeEventListener("mouseup", stopResizing);
                    document.body.style.cursor = "default";
                    document.body.style.userSelect = "auto";
                }
                return () => {
                    window.removeEventListener("mousemove", resize);
                    window.removeEventListener("mouseup", stopResizing);
                };
            }, [isResizing, resize, stopResizing]);


            // --- COMPILER LOGIC ---
            const runCode = () => {
                setConsoleOutput([]); 
                let outputLog = [];
                const addToLog = (msg) => outputLog.push(msg);

                try {
                    if (selectedLang === 'javascript') {
                        const originalConsoleLog = console.log;
                        console.log = (...args) => {
                            addToLog(args.join(' '));
                            originalConsoleLog(...args);
                        };
                        new Function(code)();
                        console.log = originalConsoleLog;
                    } else {
                        addToLog(`> Compiling ${COURSES[selectedLang].title}...`);
                        const lines = code.split('\n');
                        lines.forEach(line => {
                            const trimmed = line.trim();
                            // Simple mocks
                            if (selectedLang === 'python' && trimmed.startsWith('print(')) {
                                const match = trimmed.match(/print\((.*)\)/);
                                if (match && match[1]) addToLog(match[1].replace(/^["']|["']$/g, ''));
                            }
                            if (selectedLang === 'java' && trimmed.startsWith('System.out.println(')) {
                                const match = trimmed.match(/System\.out\.println\((.*)\)/);
                                if (match) addToLog(match[1].replace(/^["']|["']$/g, ''));
                            }
                            if (selectedLang === 'cpp' && trimmed.startsWith('cout')) {
                                const parts = trimmed.split('<<');
                                parts.shift();
                                let outStr = "";
                                parts.forEach(p => {
                                    let val = p.trim().replace(';', '');
                                    if(val.startsWith('"')) val = val.replace(/^["']|["']$/g, '');
                                    outStr += val;
                                });
                                addToLog(outStr);
                            }
                        });
                        setTimeout(() => {
                            setConsoleOutput(prev => [...outputLog, `\n=== Process exited with code 0 ===`]);
                        }, 300);
                        return;
                    }
                } catch (err) {
                    addToLog(`Error: ${err.message}`);
                }
                setConsoleOutput(outputLog);
            };

            const activeTopic = COURSES[selectedLang].topics[activeTopicIndex];

            return (
                <div className="flex flex-col h-screen bg-white text-gray-900 font-sans overflow-hidden">
                
                {/* --- HEADER --- */}
                <header className="h-16 bg-slate-900 text-white flex items-center justify-between px-6 shadow-md z-20 shrink-0">
                    <div className="flex items-center gap-2">
                        <IconCode className="text-green-400" size={28} />
                        <h1 className="text-xl font-bold tracking-wide">CodeLearn <span className="text-gray-400 font-normal text-sm ml-2">v1.1</span></h1>
                    </div>
                    <div className="flex items-center gap-4">
                        <label className="text-sm text-gray-300 hidden sm:block">Select Language:</label>
                        <div className="relative">
                            <select 
                            value={selectedLang}
                            onChange={(e) => { setSelectedLang(e.target.value); setActiveTopicIndex(0); }}
                            className="bg-slate-700 text-white pl-3 pr-8 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-green-400 appearance-none cursor-pointer"
                            >
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                            </select>
                            <div className="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none">
                            <IconChevronRight className="rotate-90 text-gray-400" size={14} />
                            </div>
                        </div>
                        <button className="sm:hidden" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>
                            <IconMenu size={24} />
                        </button>
                    </div>
                </header>

                {/* --- MAIN BODY --- */}
                <div className="flex flex-col sm:flex-row flex-1 overflow-hidden relative">
                    
                    {/* --- LEFT COLUMN: SYLLABUS --- */}
                    <nav 
                        className={`
                            absolute sm:relative z-20 sm:z-10 w-64 bg-slate-50 border-r border-gray-200 h-full flex flex-col transition-transform duration-300 shadow-xl sm:shadow-none
                            ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full sm:translate-x-0'}
                        `}
                    >
                        <div className="p-4 border-b border-gray-200 bg-white flex justify-between items-center">
                            <h2 className="font-bold text-gray-700 flex items-center gap-2"><IconBookOpen size={18} /> Syllabus</h2>
                            <button className="sm:hidden text-gray-500" onClick={() => setIsSidebarOpen(false)}><IconX size={20} /></button>
                        </div>
                        <div className="overflow-y-auto flex-1 p-2 space-y-1">
                            {COURSES[selectedLang].topics.map((topic, idx) => (
                            <button
                                key={topic.id}
                                onClick={() => { setActiveTopicIndex(idx); if (window.innerWidth < 640) setIsSidebarOpen(false); }}
                                className={`w-full text-left px-4 py-3 rounded-md text-sm font-medium transition-colors ${activeTopicIndex === idx ? 'bg-green-100 text-green-800 border-l-4 border-green-500 shadow-sm' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}`}
                            >
                                {topic.title}
                            </button>
                            ))}
                        </div>
                    </nav>

                    {/* --- MIDDLE COLUMN: EXPLANATION --- */}
                    <main className="flex-1 overflow-y-auto p-8 bg-white min-w-0">
                        <div className="mb-6">
                            <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold text-white mb-2 ${COURSES[selectedLang].color}`}>
                            {COURSES[selectedLang].title} Tutorial
                            </span>
                            <h1 className="text-3xl font-extrabold text-gray-800 mb-4">{activeTopic.title}</h1>
                            <div className="prose prose-slate max-w-none">
                            {activeTopic.explanation.split('\n').map((para, i) => (
                                <p key={i} className="mb-4 text-gray-600 leading-relaxed">{para}</p>
                            ))}
                            </div>
                        </div>
                        <div className="mt-8 p-4 bg-blue-50 border border-blue-100 rounded-lg">
                            <h3 className="text-blue-800 font-semibold mb-2 flex items-center gap-2"><IconGlobe size={16} /> Did you know?</h3>
                            <p className="text-sm text-blue-700">Practice is key! Use the editor on the right to modify the code and see how it changes the output.</p>
                        </div>
                    </main>

                    {/* --- RESIZER HANDLE (Desktop Only) --- */}
                    <div 
                        onMouseDown={startResizing}
                        className={`hidden sm:flex w-2 bg-slate-100 hover:bg-blue-400 cursor-col-resize z-30 items-center justify-center resizer-handle border-l border-r border-gray-200 transition-colors ${isResizing ? 'bg-blue-500' : ''}`}
                    >
                        <IconDrag size={12} className="text-gray-400" />
                    </div>

                    {/* --- RIGHT COLUMN: EDITOR & CONSOLE --- */}
                    <aside 
                        className="w-full flex flex-col bg-slate-900 border-l border-slate-700 transition-[width] duration-0 ease-linear"
                        style={{ width: window.innerWidth >= 640 ? `${editorWidth}%` : '100%' }}
                    >
                        {/* Editor Header */}
                        <div className="flex items-center justify-between px-4 py-2 bg-slate-800 border-b border-slate-700">
                            <span className="text-xs font-mono text-gray-400">main.{selectedLang === 'python' ? 'py' : selectedLang === 'javascript' ? 'js' : selectedLang === 'cpp' ? 'cpp' : 'java'}</span>
                            <button onClick={runCode} className="flex items-center gap-2 bg-green-600 hover:bg-green-500 text-white px-4 py-1.5 rounded text-sm font-medium transition-colors shadow-lg active:scale-95">
                                <IconPlay size={14} fill="white" /> Run Code
                            </button>
                        </div>

                        {/* Code Editor Area */}
                        <div className="flex-1 relative group">
                            <textarea
                            value={code}
                            onChange={(e) => setCode(e.target.value)}
                            className="w-full h-full bg-slate-900 text-gray-300 font-mono text-sm p-4 resize-none focus:outline-none leading-6 selection:bg-slate-700"
                            spellCheck="false"
                            ></textarea>
                        </div>

                        {/* Console Output Area */}
                        <div className="h-1/3 min-h-[150px] bg-black border-t border-slate-700 flex flex-col">
                            <div className="px-4 py-1 bg-slate-800 text-xs text-gray-400 font-mono border-b border-slate-700 flex items-center gap-2">
                            <IconTerminal size={12} /> Terminal / Output
                            </div>
                            <div className="flex-1 p-4 font-mono text-sm overflow-y-auto">
                            {consoleOutput.length === 0 ? (
                                <span className="text-gray-600 italic">Click "Run Code" to see output...</span>
                            ) : (
                                consoleOutput.map((line, idx) => (
                                <div key={idx} className="text-green-400 whitespace-pre-wrap">{line}</div>
                                ))
                            )}
                            </div>
                        </div>
                    </aside>

                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
